<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verdant — Fresh Grocery Market</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-deep:   #1a3c2e;
    --green-mid:    #2d6a4f;
    --green-light:  #52b788;
    --cream:        #f8f4ec;
    --cream-dark:   #efe8d5;
    --terra:        #c9714a;
    --terra-light:  #e8956b;
    --charcoal:     #1e1e1e;
    --text-muted:   #6b7b6e;
    --white:        #ffffff;
    --shadow-sm:    0 2px 12px rgba(26,60,46,.10);
    --shadow-md:    0 8px 32px rgba(26,60,46,.16);
    --shadow-lg:    0 24px 64px rgba(26,60,46,.22);
    --radius:       16px;
    --radius-sm:    10px;
    --transition:   .32s cubic-bezier(.4,0,.2,1);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    overflow-x: hidden;
  }

  /* ─── NOISE OVERLAY ──────────────────────────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: .4;
  }

  /* ─── SCROLLBAR ──────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--cream); }
  ::-webkit-scrollbar-thumb { background: var(--green-light); border-radius: 99px; }

  /* ─── HEADER ─────────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(248,244,236,.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(45,106,79,.12);
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    height: 72px;
    animation: slideDown .6s ease both;
  }
  @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem; font-weight: 800;
    color: var(--green-deep);
    letter-spacing: -.02em;
    display: flex; align-items: center; gap: 10px;
    text-decoration: none;
  }
  .logo-leaf {
    width: 32px; height: 32px;
    background: var(--green-mid);
    border-radius: 50% 4px 50% 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    animation: leafSpin 6s ease-in-out infinite;
  }
  @keyframes leafSpin {
    0%,100% { transform: rotate(0deg) scale(1); }
    50%     { transform: rotate(15deg) scale(1.08); }
  }

  .header-search {
    flex: 1; max-width: 440px; margin: 0 48px;
    position: relative;
  }
  .header-search input {
    width: 100%;
    padding: 10px 20px 10px 46px;
    border: 1.5px solid var(--cream-dark);
    border-radius: 99px;
    background: var(--white);
    font-family: 'DM Sans', sans-serif; font-size: .92rem;
    color: var(--charcoal);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .header-search input:focus {
    border-color: var(--green-light);
    box-shadow: 0 0 0 3px rgba(82,183,136,.18);
  }
  .header-search .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); pointer-events: none; font-size: 1rem;
  }

  .header-actions { display: flex; align-items: center; gap: 20px; }

  .btn-cart {
    position: relative;
    background: var(--green-deep);
    color: var(--white);
    border: none; cursor: pointer;
    padding: 10px 22px;
    border-radius: 99px;
    font-family: 'DM Sans', sans-serif; font-size: .9rem; font-weight: 500;
    display: flex; align-items: center; gap: 8px;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
  }
  .btn-cart:hover {
    background: var(--green-mid);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .cart-badge {
    position: absolute; top: -6px; right: -6px;
    background: var(--terra);
    color: var(--white);
    width: 20px; height: 20px;
    border-radius: 50%;
    font-size: .7rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    transform: scale(0);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .cart-badge.visible { transform: scale(1); }

  /* ─── HERO ───────────────────────────────────────────── */
  .hero {
    background: var(--green-deep);
    padding: 80px 40px;
    display: flex; align-items: center; justify-content: space-between;
    overflow: hidden; position: relative;
    min-height: 360px;
  }
  .hero::after {
    content: '';
    position: absolute; right: -100px; bottom: -60px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(82,183,136,.25) 0%, transparent 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  .hero-content { position: relative; z-index: 2; max-width: 540px; }
  .hero-tag {
    display: inline-block;
    background: rgba(82,183,136,.2);
    color: var(--green-light);
    border: 1px solid rgba(82,183,136,.35);
    padding: 4px 14px; border-radius: 99px;
    font-size: .8rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
    margin-bottom: 20px;
    animation: fadeUp .6s .1s ease both;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 4vw, 3.4rem);
    font-weight: 800; color: var(--white);
    line-height: 1.15; letter-spacing: -.02em;
    animation: fadeUp .6s .2s ease both;
  }
  .hero h1 em { font-style: italic; color: var(--green-light); }
  .hero p {
    color: rgba(255,255,255,.65); font-size: 1.05rem;
    margin: 18px 0 32px; line-height: 1.65;
    animation: fadeUp .6s .3s ease both;
  }
  .hero-cta {
    display: flex; gap: 14px; flex-wrap: wrap;
    animation: fadeUp .6s .4s ease both;
  }
  .btn-primary {
    padding: 14px 28px; border-radius: 99px;
    background: var(--terra); color: var(--white);
    border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: .95rem; font-weight: 600;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
  }
  .btn-primary:hover { background: var(--terra-light); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(201,113,74,.35); }
  .btn-outline {
    padding: 13px 26px; border-radius: 99px;
    background: transparent; color: var(--white);
    border: 1.5px solid rgba(255,255,255,.3); cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: .95rem; font-weight: 500;
    transition: border-color var(--transition), background var(--transition);
  }
  .btn-outline:hover { border-color: var(--white); background: rgba(255,255,255,.08); }

  .hero-floats {
    position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
    display: grid; grid-template-columns: repeat(3, 80px); gap: 12px;
    z-index: 2;
    animation: fadeUp .7s .5s ease both;
  }
  @media(max-width: 768px) { .hero-floats { display: none; } }
  .float-item {
    aspect-ratio: 1;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    backdrop-filter: blur(4px);
    animation: floatAnim calc(3s + var(--d, 0s)) ease-in-out infinite alternate;
  }
  @keyframes floatAnim { from { transform: translateY(0); } to { transform: translateY(-8px); } }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── STATS BAR ──────────────────────────────────────── */
  .stats-bar {
    background: var(--white);
    border-bottom: 1px solid var(--cream-dark);
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-around;
    flex-wrap: wrap; gap: 0;
  }
  .stat {
    padding: 20px 24px;
    display: flex; align-items: center; gap: 12px;
    border-right: 1px solid var(--cream-dark);
  }
  .stat:last-child { border-right: none; }
  .stat-icon { font-size: 1.5rem; }
  .stat-text strong { display: block; font-size: .95rem; font-weight: 600; color: var(--green-deep); }
  .stat-text span { font-size: .78rem; color: var(--text-muted); }

  /* ─── MAIN LAYOUT ────────────────────────────────────── */
  .main-wrap { padding: 48px 40px; max-width: 1440px; margin: 0 auto; }

  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 28px;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.75rem; font-weight: 700;
    color: var(--green-deep); letter-spacing: -.02em;
  }
  .section-title span { color: var(--terra); font-style: italic; }
  .view-all {
    color: var(--green-mid); font-size: .88rem; font-weight: 500;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    transition: color var(--transition);
  }
  .view-all:hover { color: var(--terra); }

  /* ─── CATEGORY TABS ──────────────────────────────────── */
  .cats-wrap {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 40px;
    animation: fadeUp .5s ease both;
  }
  .cat-btn {
    padding: 9px 20px; border-radius: 99px;
    border: 1.5px solid var(--cream-dark);
    background: var(--white); cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: .88rem; font-weight: 500;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 7px;
    transition: all var(--transition);
  }
  .cat-btn:hover { border-color: var(--green-light); color: var(--green-deep); }
  .cat-btn.active {
    background: var(--green-deep); border-color: var(--green-deep);
    color: var(--white); box-shadow: var(--shadow-sm);
  }

  /* ─── PRODUCT GRID ───────────────────────────────────── */
  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px;
  }

  .product-card {
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--cream-dark);
    transition: transform var(--transition), box-shadow var(--transition), opacity .3s ease;
    animation: cardIn .4s ease both;
    cursor: pointer;
  }
  .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
  .product-card.hidden { display: none; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-img {
    width: 100%; height: 180px;
    background: var(--cream);
    display: flex; align-items: center; justify-content: center;
    font-size: 4.5rem;
    position: relative; overflow: hidden;
    transition: background var(--transition);
  }
  .product-card:hover .card-img { background: var(--cream-dark); }
  .card-img .emoji {
    transition: transform var(--transition);
    display: block;
  }
  .product-card:hover .card-img .emoji { transform: scale(1.15) rotate(5deg); }

  .card-badge {
    position: absolute; top: 12px; left: 12px;
    background: var(--terra); color: var(--white);
    padding: 3px 10px; border-radius: 99px;
    font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  }
  .card-badge.fresh { background: var(--green-mid); }
  .card-badge.sale  { background: var(--terra); }

  .card-wishlist {
    position: absolute; top: 10px; right: 10px;
    background: var(--white); border: none; cursor: pointer;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition), background var(--transition);
  }
  .card-wishlist:hover { transform: scale(1.15); }
  .card-wishlist.liked { background: #fff0f0; }

  .card-body { padding: 16px 18px 20px; }
  .card-cat { font-size: .72rem; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 5px; }
  .card-name { font-weight: 600; font-size: 1rem; color: var(--charcoal); margin-bottom: 6px; line-height: 1.3; }
  .card-weight { font-size: .8rem; color: var(--text-muted); }

  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px;
  }
  .card-price { font-size: 1.15rem; font-weight: 700; color: var(--green-deep); }
  .card-price .old { text-decoration: line-through; color: var(--text-muted); font-size: .8rem; font-weight: 400; margin-left: 6px; }

  .card-add {
    display: flex; align-items: center; gap: 0;
    background: var(--green-deep); border: none; cursor: pointer;
    border-radius: 99px; overflow: hidden;
    transition: background var(--transition);
  }
  .card-add:hover { background: var(--green-mid); }

  .qty-ctrl {
    background: transparent; border: none; cursor: pointer;
    color: var(--white); font-size: 1.1rem;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition);
  }
  .qty-ctrl:hover { background: rgba(255,255,255,.15); }

  .qty-num {
    color: var(--white); font-size: .85rem; font-weight: 600;
    min-width: 20px; text-align: center;
    transition: transform .2s ease;
  }

  .add-btn {
    background: var(--terra); border: none; cursor: pointer;
    color: var(--white); font-family: 'DM Sans', sans-serif; font-size: .85rem; font-weight: 600;
    padding: 8px 16px; border-radius: 99px;
    transition: background var(--transition), transform var(--transition);
  }
  .add-btn:hover { background: var(--terra-light); transform: scale(1.04); }
  .add-btn:active { transform: scale(.96); }

  /* ─── CART DRAWER ────────────────────────────────────── */
  .cart-overlay {
    position: fixed; inset: 0; background: rgba(26,60,46,.4);
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity var(--transition);
    backdrop-filter: blur(2px);
  }
  .cart-overlay.open { opacity: 1; pointer-events: auto; }

  .cart-drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(420px, 100vw);
    background: var(--white);
    z-index: 201;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .42s cubic-bezier(.4,0,.2,1);
    box-shadow: var(--shadow-lg);
  }
  .cart-drawer.open { transform: translateX(0); }

  .cart-header {
    padding: 24px 24px 20px;
    border-bottom: 1px solid var(--cream-dark);
    display: flex; align-items: center; justify-content: space-between;
  }
  .cart-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem; font-weight: 700; color: var(--green-deep);
  }
  .cart-close {
    background: var(--cream); border: none; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    transition: background var(--transition), transform var(--transition);
  }
  .cart-close:hover { background: var(--cream-dark); transform: rotate(90deg); }

  .cart-items { flex: 1; overflow-y: auto; padding: 16px 24px; }

  .cart-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 16px; opacity: .6;
    font-size: 1rem; color: var(--text-muted);
  }
  .cart-empty-icon { font-size: 4rem; }

  .cart-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--cream-dark);
    animation: slideIn .3s ease both;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  .cart-item:last-child { border-bottom: none; }
  .ci-icon { width: 52px; height: 52px; background: var(--cream); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
  .ci-info { flex: 1; }
  .ci-name { font-weight: 600; font-size: .9rem; color: var(--charcoal); }
  .ci-price { font-size: .85rem; color: var(--text-muted); margin-top: 3px; }
  .ci-controls { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .ci-btn {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid var(--cream-dark); background: var(--white);
    cursor: pointer; font-size: 1rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    color: var(--charcoal);
    transition: border-color var(--transition), background var(--transition);
  }
  .ci-btn:hover { border-color: var(--green-light); background: var(--cream); }
  .ci-qty { font-size: .88rem; font-weight: 600; min-width: 20px; text-align: center; }
  .ci-total { font-weight: 700; font-size: .95rem; color: var(--green-deep); }
  .ci-remove {
    background: none; border: none; cursor: pointer; font-size: .9rem; color: var(--text-muted);
    padding: 4px; border-radius: 6px;
    transition: color var(--transition), background var(--transition);
  }
  .ci-remove:hover { color: #e53e3e; background: #fff5f5; }

  .cart-footer {
    padding: 20px 24px 28px;
    border-top: 1px solid var(--cream-dark);
    background: var(--cream);
  }
  .cart-subtotal {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    font-size: .9rem; color: var(--text-muted);
  }
  .cart-total {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    font-size: 1.05rem; font-weight: 700; color: var(--green-deep);
  }
  .cart-total span:last-child { font-size: 1.3rem; font-family: 'Playfair Display', serif; }
  .btn-checkout {
    width: 100%; padding: 16px;
    background: var(--green-deep); color: var(--white); border: none; cursor: pointer;
    border-radius: 99px; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
  }
  .btn-checkout:hover {
    background: var(--green-mid); transform: translateY(-2px); box-shadow: var(--shadow-md);
  }

  /* ─── TOAST ──────────────────────────────────────────── */
  .toast-container { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .toast {
    background: var(--green-deep); color: var(--white);
    padding: 12px 22px; border-radius: 99px;
    font-size: .88rem; font-weight: 500;
    display: flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow-md);
    animation: toastIn .35s cubic-bezier(.34,1.56,.64,1) both;
    white-space: nowrap;
  }
  .toast.out { animation: toastOut .3s ease both; }
  @keyframes toastIn  { from { opacity: 0; transform: translateY(20px) scale(.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes toastOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.85); } }

  /* ─── DEALS SECTION ──────────────────────────────────── */
  .deals-section { margin-top: 64px; }
  .deals-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
    margin-top: 28px;
  }
  .deal-card {
    border-radius: var(--radius);
    padding: 28px 24px;
    position: re
